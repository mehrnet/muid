<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff8a2a" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ff8a2a" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0c0f12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd1a1" />
      <stop offset="100%" stop-color="#ff8a2a" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a3d" />
      <stop offset="100%" stop-color="#c45300" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb870" />
      <stop offset="100%" stop-color="#e06500" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181e26" />
      <stop offset="100%" stop-color="#10141a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="#0c0f12" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="570" x2="1200" y2="570" />
  </g>

  <!-- Brand & Logo -->
  <g transform="translate(80, 75)">
    <!-- 3D Cube Icon (60x60 scaled to 72x72) -->
    <g transform="scale(1.2)">
      <!-- Top Face -->
      <polygon points="27.6,6 47.2,17.3 27.6,28.6 8,17.3" fill="url(#cubeTop)" />
      <!-- Left Face -->
      <polygon points="8,19.1 27.6,30.4 27.6,54 8,42.7" fill="url(#cubeLeft)" />
      <!-- Right Face -->
      <polygon points="27.6,30.4 47.2,19.1 47.2,42.7 27.6,54" fill="url(#cubeRight)" />
    </g>

    <!-- Header Text -->
    <text x="96" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ff8a2a" letter-spacing="1">MEHRNET SPECIFICATION</text>
    <text x="96" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">Mehr Unique ID (MUID)</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    K-sortable 64-bit database BigInts, Base36 case-insensitive identifiers, and 256-bit Base62 tokens.
  </text>

  <!-- Interactive Card Mockup -->
  <g transform="translate(80, 245)" filter="url(#shadow)">
    <!-- Card Container -->
    <rect width="1040" height="270" rx="16" fill="url(#cardGrad)" stroke="#262f3d" stroke-width="1.5" />

    <!-- Card Head -->
    <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">CREDENTIAL STANDARD ARCHITECTURE</text>
    <rect x="880" y="24" width="128" height="28" rx="14" fill="rgba(255, 138, 42, 0.15)" stroke="rgba(255, 138, 42, 0.35)" stroke-width="1" />
    <text x="944" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ff8a2a" text-anchor="middle">DAY 0 GENESIS</text>

    <!-- Top Row: Account ID & Raw ID -->
    <!-- Col 1: Account ID -->
    <g transform="translate(32, 70)">
      <rect width="470" height="66" rx="10" fill="#0d1117" stroke="#1f2733" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">ACCOUNT ID (BASE36 · CASE-INSENSITIVE)</text>
      <text x="18" y="52" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="700" fill="#ff8a2a">6gq46u</text>
    </g>

    <!-- Col 2: Raw BigInt ID -->
    <g transform="translate(538, 70)">
      <rect width="470" height="66" rx="10" fill="#0d1117" stroke="#1f2733" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">RAW DATABASE ID (64-BIT BIGINT)</text>
      <text x="18" y="52" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="700" fill="#f8fafc">13954201234</text>
    </g>

    <!-- Bottom Row: Account Token -->
    <g transform="translate(32, 150)">
      <rect width="976" height="84" rx="10" fill="#0d1117" stroke="#1f2733" stroke-width="1" />
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">ACCOUNT TOKEN (ID : 256-BIT BASE62 SECRET)</text>
      <text x="18" y="60" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="700">
        <tspan fill="#ff8a2a">6gq46u</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">1Xy7K9pQ2LmN4zBt8vXw3zR7kM6bC5dA4e3f2g1h0iJ</tspan>
      </text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(80, 565)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#64748b">API REGEX: ^[0-9a-z]{6,12}:[0-9a-zA-Z]{43}$</text>
    <text x="1040" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="end">muid.mehrnet.com</text>
  </g>
</svg>
